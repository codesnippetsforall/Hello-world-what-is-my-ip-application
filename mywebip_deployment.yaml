apiVersion: apps/v1
kind: Deployment
metadata:
  name: mywebip-deployment
  labels: 
    app: mywebip_deploy_lbl
  namespace: default
spec:
  replicas: 3
  strategy: 
    type: RollingUpdate
    rollingUpdate:
  selector: 
    matchLabels:
      app: mywebip_lbl
  template:
    metadata:
      labels: 
        app: mywebip_lbl
    spec:
      containers:
        - name: mywebipcntr
          image: dockermano1984/whatismyip:v1
          #image: dockermano1984/myhostip:v1
          ports:
            - containerPort: 80
            
---

apiVersion: v1
kind: Service
metadata:
  name: mywebippod-service
  labels: 
    app: mywebip_lbl
spec:
  type: NodePort
  selector:
    app: mywebip_lbl
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30060